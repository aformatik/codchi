[workspace]
resolver = "2"
# Phase 0 deactivates the beta/v1 product crates from compilation so the v1
# contract crate (`codchi-api`) builds and tests in isolation. The crates below
# are kept on disk as reference and are re-added to `members` as each is
# migrated onto the `codchi-api` contract. See v1/STATUS.md.
members = [
    "codchi-api",
]
exclude = [
    "codchi",
    "codchiw",
    "codchi-server",
    "codchi-gui",
    "shared",
    "ipc",
    "utils",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88.0"

# Only the `codchi-api` dependencies remain active. The deactivated crates above
# carry their own (now-dangling) workspace dep references; restore the relevant
# entries here when re-activating a crate.
[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
uuid = { version = "1", features = ["v7", "serde"] }
schemars = { version = "0.8", features = ["chrono", "uuid1", "derive"] }
aide = { version = "0.14", default-features = false }
futures-core = "0.3"
indexmap = "2"
serde = "1"
serde_json = "1"
thiserror = "2.0"
futures = "0.3"

[profile.release]
lto = true
strip = true

